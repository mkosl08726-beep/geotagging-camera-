<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GeoCam — Full Screen Geotagging</title>
<style>
  :root {
    --bg: #000;
    --panel: #121821;
    --line: #26324a;
    --text: #e6edf5;
    --muted: #8b9bb0;
    --accent: #35d0a5;
    --danger: #ff4d5e;
    --shutter: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* Full Screen Camera */
  #preview {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; background: #000; z-index: 1;
  }
  #preview.mirror { transform: scaleX(-1); }

  /* Top HUD */
  #hud {
    position: absolute; top: 20px; left: 20px; right: 20px; z-index: 10;
    pointer-events: none; display: flex; flex-direction: column; gap: 6px;
  }
  .hud-badge {
    background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
    padding: 6px 12px; font-size: 12px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
    align-self: flex-start;
  }
  .hud-badge.ok { color: var(--accent); }
  .hud-badge.err { color: var(--danger); }

  /* Bottom Controls */
  #controls {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
    padding: 30px 20px 50px 20px;
    background: linear-gradient(transparent, rgba(0,0,0,0.85) 60%);
    display: flex; justify-content: space-between; align-items: center;
  }
  .btn-icon {
    width: 50px; height: 50px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
    color: white; font-size: 22px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: 0.2s;
  }
  .btn-icon:active { background: rgba(255,255,255,0.3); transform: scale(0.95); }
  .btn-icon:disabled { opacity: 0.3; }

  /* Shutter Button */
  .shutter-wrap {
    position: relative; width: 80px; height: 80px;
    display: flex; align-items: center; justify-content: center;
  }
  .shutter {
    width: 72px; height: 72px; border-radius: 50%;
    border: 4px solid var(--shutter); background: transparent;
    cursor: pointer; transition: 0.15s; padding: 0;
  }
  .shutter:active { background: rgba(255,255,255,0.5); transform: scale(0.95); }
  .shutter:disabled { opacity: 0.3; }
  .shutter.recording { border-color: var(--danger); background: var(--danger); animation: pulse 1.5s infinite; }

  /* Record Button */
  .btn-record {
    width: 50px; height: 50px; border-radius: 50%;
    border: 2px solid var(--danger); background: transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: 0.2s;
  }
  .btn-record .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--danger); transition: 0.2s; }
  .btn-record.active .dot { width: 14px; height: 14px; border-radius: 2px; }
  .btn-record:active { transform: scale(0.9); }
  .btn-record:disabled { opacity: 0.3; }

  /* Recording Timer */
  #recTimer {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); color: var(--danger); font-weight: bold;
    padding: 6px 16px; border-radius: 20px; font-size: 14px; z-index: 15;
    display: none; align-items: center; gap: 8px;
  }
  #recTimer.on { display: flex; }
  #recTimer .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); animation: pulse 1s infinite; }

  /* Start Overlay */
  #startOverlay {
    position: absolute; inset: 0; z-index: 20;
    background: rgba(0,0,0,0.8); backdrop-filter: blur(6px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    transition: opacity 0.3s; text-align: center; padding: 20px;
  }
  #startOverlay.hidden { opacity: 0; pointer-events: none; }
  #startOverlay h1 { margin: 0; font-size: 28px; }
  #startOverlay p { color: var(--muted); margin: 0; max-width: 300px; }
  .btn-primary {
    background: linear-gradient(180deg, #35d0a5, #25a884);
    color: #04231b; border: none; padding: 14px 32px;
    border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer;
    transition: 0.2s;
  }
  .btn-primary:active { transform: scale(0.96); }

  /* Settings & Gallery Panels */
  .panel {
    position: absolute; top: 0; right: -100%; width: 100%; max-width: 360px; height: 100%;
    background: var(--panel); z-index: 30; transition: right 0.3s ease;
    display: flex; flex-direction: column; border-left: 1px solid var(--line);
    box-shadow: -10px 0 30px rgba(0,0,0,0.5);
  }
  .panel.open { right: 0; }
  .panel-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px; border-bottom: 1px solid var(--line);
  }
  .panel-header h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .panel-body { padding: 20px; overflow-y: auto; flex: 1; }
  .close-btn { background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; padding: 0; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; }
  .field input, .field textarea {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: #0d131c; color: var(--text); font: inherit; outline: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }

  .switch { display: flex; align-items: center; gap: 12px; padding: 12px 0; font-size: 14px; cursor: pointer; }
  .switch input { appearance: none; width: 44px; height: 26px; border-radius: 999px; background: #2a3547; position: relative; transition: 0.2s; cursor: pointer; flex: none; border: none; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #8b9bb0; transition: 0.2s; }
  .switch input:checked { background: rgba(53,208,165,0.3); }
  .switch input:checked::after { left: 21px; background: var(--accent); }

  .gallery-grid { display: flex; flex-direction: column; gap: 12px; }
  .gallery-item { display: flex; gap: 12px; align-items: center; background: #182130; border-radius: 12px; padding: 10px; border: 1px solid var(--line); }
  .gallery-item img, .gallery-item video { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: #000; }
  .gallery-item .info { flex: 1; min-width: 0; }
  .gallery-item .name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gallery-item .sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gallery-item .acts { display: flex; gap: 6px; }
  .gallery-item .acts a, .gallery-item .acts button {
    padding: 6px 10px; font-size: 12px; border-radius: 6px; border: 1px solid var(--line);
    background: #0f1621; color: var(--muted); text-decoration: none; cursor: pointer; font-weight: 600;
  }
  .gallery-item .acts a:active, .gallery-item .acts button:active { background: var(--accent); color: #000; }
  .empty-msg { color: var(--muted); font-size: 13px; font-style: italic; text-align: center; margin-top: 40px; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* Flash Effect */
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 5; transition: opacity 0.1s; }
  #flash.go { opacity: 0.9; transition: none; }
</style>
</head>
<body>

<!-- Camera Preview -->
<video id="preview" autoplay playsinline muted></video>
<div id="flash"></div>

<!-- Top HUD -->
<div id="hud">
  <div class="hud-badge" id="gpsStatus">📍 Waiting for GPS...</div>
  <div class="hud-badge" id="secBadge" style="color: var(--muted);">🔒 Secure context</div>
</div>

<!-- Recording Timer -->
<div id="recTimer"><span class="dot"></span><span id="recTime">00:00</span></div>

<!-- Bottom Controls -->
<div id="controls">
  <button class="btn-icon" id="btnGallery" title="Gallery">🖼️</button>
  
  <div class="shutter-wrap">
    <button class="shutter" id="btnShutter" disabled title="Take Photo"></button>
  </div>

  <div style="display: flex; gap: 10px; align-items: center;">
    <button class="btn-record" id="btnRecord" disabled title="Record Video"><div class="dot"></div></button>
    <button class="btn-icon" id="btnSettings" title="Settings">⚙️</button>
  </div>
</div>

<!-- Start Overlay -->
<div id="startOverlay">
  <h1>GeoCam</h1>
  <p>Geotagged photos & videos directly to your device.</p>
  <button class="btn-primary" id="btnStart">Start Camera & GPS</button>
  <p style="font-size: 11px; margin-top: 10px;">Requires HTTPS or localhost</p>
</div>

<!-- Settings Panel -->
<div class="panel" id="settingsPanel">
  <div class="panel-header">
    <h2>Settings</h2>
    <button class="close-btn" id="closeSettings">×</button>
  </div>
  <div class="panel-body">
    <div class="field">
      <label for="locationName">Location Name</label>
      <input type="text" id="locationName" placeholder="e.g. Treetop Hideaways" maxlength="40">
    </div>
    <div class="field">
      <label for="userNote">Note</label>
      <input type="text" id="userNote" placeholder="e.g. Amazing place to spend vacation" maxlength="80">
    </div>
    <label class="switch"><input type="checkbox" id="chkOverlay" checked> Burn rich watermark</label>
    <label class="switch"><input type="checkbox" id="chkExif" checked> Write EXIF GPS into JPEG</label>
    <label class="switch"><input type="checkbox" id="chkAudio" checked> Record microphone with video</label>
    <button class="btn-primary" id="btnSwitchCam" style="width: 100%; margin-top: 20px; background: linear-gradient(180deg, #3aa0ff, #2b7ddb); color: #031a30;">Switch Camera</button>
  </div>
</div>

<!-- Gallery Panel -->
<div class="panel" id="galleryPanel">
  <div class="panel-header">
    <h2>Captured (<span id="count">0</span>)</h2>
    <button class="close-btn" id="closeGallery">×</button>
  </div>
  <div class="panel-body">
    <div class="gallery-grid" id="galleryGrid">
      <div class="empty-msg">No captures yet.</div>
    </div>
  </div>
</div>

<script>
'use strict';

/* =========================================================
   0. Helpers & State
   ========================================================= */
const $ = (s) => document.querySelector(s);

const els = {
  video: $('#preview'),
  flash: $('#flash'),
  gpsStatus: $('#gpsStatus'),
  secBadge: $('#secBadge'),
  btnShutter: $('#btnShutter'),
  btnRecord: $('#btnRecord'),
  btnGallery: $('#btnGallery'),
  btnSettings: $('#btnSettings'),
  btnStart: $('#btnStart'),
  btnSwitchCam: $('#btnSwitchCam'),
  startOverlay: $('#startOverlay'),
  settingsPanel: $('#settingsPanel'),
  galleryPanel: $('#galleryPanel'),
  closeSettings: $('#closeSettings'),
  closeGallery: $('#closeGallery'),
  locationName: $('#locationName'),
  userNote: $('#userNote'),
  chkOverlay: $('#chkOverlay'),
  chkExif: $('#chkExif'),
  chkAudio: $('#chkAudio'),
  recTimer: $('#recTimer'),
  recTime: $('#recTime'),
  galleryGrid: $('#galleryGrid'),
  count: $('#count'),
};

const state = {
  stream: null,
  position: null,
  geoError: null,
  watchId: null,
  facingMode: 'environment',
  recording: false,
  recorder: null,
  chunks: [],
  recStart: 0,
  recTicker: null,
  recFrameHandle: null,
  recUsingRVFC: false,
  items: [],
  itemSeq: 0,
  mapTileImg: new Image(),
  mapTileLoaded: false,
};

state.mapTileImg.crossOrigin = "anonymous";

function setStatus(msg, kind = '') {
  els.gpsStatus.textContent = msg;
  els.gpsStatus.className = 'hud-badge ' + kind;
}

function pad2(n) { return String(n).padStart(2, '0'); }

function formatCoords(lat, lon) {
  return `${Math.abs(lat).toFixed(6)}° ${lat >= 0 ? 'N' : 'S'}, ` +
         `${Math.abs(lon).toFixed(6)}° ${lon >= 0 ? 'E' : 'W'}`;
}

/* =========================================================
   Plus Code Generator
   ========================================================= */
function encodePlusCode(lat, lon) {
  const alphabet = '23456789CFGHJMPQRVWX';
  let latVal = lat + 90;
  let lonVal = lon + 180;
  let code = '';
  let latRes = 20, lonRes = 20;

  for (let i = 0; i < 4; i++) {
    const latDigit = Math.floor(latVal / latRes);
    const lonDigit = Math.floor(lonVal / lonRes);
    code += alphabet[latDigit] + alphabet[lonDigit];
    latVal %= latRes; lonVal %= lonRes;
    latRes /= 20; lonRes /= 20;
  }
  latRes = 0.05; lonRes = 0.05;
  for (let i = 0; i < 1; i++) {
    const latDigit = Math.floor(latVal / latRes);
    const lonDigit = Math.floor(lonVal / lonRes);
    code += alphabet[latDigit] + alphabet[lonDigit];
    latVal %= latRes; lonVal %= lonRes;
    latRes /= 20; lonRes /= 20;
  }
  return code.slice(0, 8) + '+' + code.slice(8);
}

/* =========================================================
   1. Security Check
   ========================================================= */
(function checkSecure() {
  if (!window.isSecureContext) {
    els.secBadge.textContent = '⚠️ Insecure context';
    els.secBadge.style.color = '#ff4d5e';
    setStatus('Camera & GPS need HTTPS', 'err');
  }
})();

/* =========================================================
   2. Map Tile Fetcher
   ========================================================= */
function lon2tile(lon, zoom) { return (Math.floor((lon + 180) / 360 * Math.pow(2, zoom))); }
function lat2tile(lat, zoom) { return (Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom))); }

function updateMapTile(lat, lon) {
  const zoom = 16;
  const x = lon2tile(lon, zoom);
  const y = lat2tile(lat, zoom);
  state.mapTileLoaded = false;
  state.mapTileImg.src = `https://tile.openstreetmap.org/${zoom}/${x}/${y}.png`;
}

state.mapTileImg.onload = () => { state.mapTileLoaded = true; };
state.mapTileImg.onerror = () => { state.mapTileLoaded = false; };

/* =========================================================
   3. Geolocation
   ========================================================= */
function startGeolocation() {
  if (!('geolocation' in navigator)) {
    setStatus('Geolocation not supported', 'err');
    return;
  }
  if (state.watchId !== null) return;

  state.watchId = navigator.geolocation.watchPosition(
    (pos) => {
      state.position = {
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        altitude: pos.coords.altitude,
        altitudeAccuracy: pos.coords.altitudeAccuracy,
        heading: pos.coords.heading,
        speed: pos.coords.speed,
        timestamp: pos.timestamp,
      };
      state.geoError = null;
      setStatus(`📍 ±${Math.round(pos.coords.accuracy)}m`, 'ok');
      updateMapTile(pos.coords.latitude, pos.coords.longitude);
    },
    (err) => {
      state.geoError = err.message || 'Location error';
      setStatus('GPS error: ' + state.geoError, 'err');
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
  );
}

function stopGeolocation() {
  if (state.watchId !== null) {
    navigator.geolocation.clearWatch(state.watchId);
    state.watchId = null;
  }
}

/* =========================================================
   4. Camera
   ========================================================= */
async function startCamera() {
  stopCamera();

  const wantAudio = els.chkAudio.checked;
  const baseVideo = {
    facingMode: { ideal: state.facingMode },
    width:  { ideal: 1920 },
    height: { ideal: 1080 },
  };

  let stream = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: baseVideo,
      audio: wantAudio
        ? { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        : false,
    });
  } catch (err) {
    if (wantAudio) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: baseVideo, audio: false });
        setStatus('Camera on (no mic)', 'err');
      } catch (err2) {
        setStatus('Camera error: ' + (err2.message || err2.name), 'err');
        return;
      }
    } else {
      setStatus('Camera error: ' + (err.message || err.name), 'err');
      return;
    }
  }

  state.stream = stream;
  els.video.srcObject = stream;

  const mirror = state.facingMode === 'user';
  els.video.classList.toggle('mirror', mirror);

  try { await els.video.play(); } catch (_) {}

  els.btnShutter.disabled = false;
  els.btnRecord.disabled = false;
  els.startOverlay.classList.add('hidden');

  startGeolocation();
}

function stopCamera() {
  if (state.recording) stopRecording();
  if (state.stream) {
    state.stream.getTracks().forEach(t => t.stop());
    state.stream = null;
  }
  els.video.srcObject = null;
}

async function switchCamera() {
  state.facingMode = state.facingMode === 'environment' ? 'user' : 'environment';
  await startCamera();
}

/* =========================================================
   5. Watermark Drawing (with Real Map)
   ========================================================= */
function roundRectPath(ctx, x, y, w, h, r) {
  if (typeof ctx.roundRect === 'function') {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return;
  }
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawWatermark(ctx, w, h) {
  const p = state.position;
  const now = new Date();
  const base = Math.min(w, h);
  
  const pad = base * 0.04;
  const boxW = w * 0.82;
  const boxH = Math.max(180, boxW * 0.42);
  const bx = pad;
  const by = h - pad - boxH;
  
  const mapSize = boxH - pad * 2;
  const mx = bx + pad;
  const my = by + pad;
  
  const tx = mx + mapSize + pad;
  const ty = my + pad;
  const textMaxW = boxW - pad * 2 - mapSize - pad;

  // 1. Main background panel
  ctx.fillStyle = 'rgba(15, 20, 25, 0.88)';
  roundRectPath(ctx, bx, by, boxW, boxH, 12);
  ctx.fill();

  // 2. Map Area
  ctx.save();
  roundRectPath(ctx, mx, my, mapSize, mapSize, 8);
  ctx.clip();

  if (state.mapTileLoaded && p) {
    // Draw real map tile
    const zoom = 16;
    const tileX = lon2tile(p.lon, zoom);
    const tileY = lat2tile(p.lat, zoom);
    
    // Calculate exact pixel position within the tile
    const pixelX = ((p.lon + 180) / 360 * Math.pow(2, zoom) - tileX) * 256;
    const pixelY = ((1 - Math.log(Math.tan(p.lat * Math.PI / 180) + 1 / Math.cos(p.lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom) - tileY) * 256;

    const offsetX = mapSize / 2 - pixelX;
    const offsetY = mapSize / 2 - pixelY;

    ctx.drawImage(state.mapTileImg, mx + offsetX, my + offsetY, 256, 256);

    // Draw Pin
    const pinX = mx + mapSize / 2;
    const pinY = my + mapSize / 2;
    ctx.fillStyle = 'rgba(255, 77, 94, 0.4)';
    ctx.beginPath(); ctx.arc(pinX, pinY, base * 0.025, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff4d5e';
    ctx.beginPath(); ctx.arc(pinX, pinY, base * 0.012, 0, Math.PI * 2); ctx.fill();
  } else {
    // Fallback: Simulated map grid
    ctx.fillStyle = '#1a2634'; ctx.fillRect(mx, my, mapSize, mapSize);
    ctx.strokeStyle = '#2a3b4c'; ctx.lineWidth = Math.max(2, base * 0.003);
    ctx.beginPath();
    ctx.moveTo(mx, my + mapSize * 0.3); ctx.lineTo(mx + mapSize, my + mapSize * 0.3);
    ctx.moveTo(mx + mapSize * 0.4, my); ctx.lineTo(mx + mapSize * 0.4, my + mapSize);
    ctx.moveTo(mx, my + mapSize * 0.7); ctx.lineTo(mx + mapSize, my + mapSize * 0.7);
    ctx.moveTo(mx + mapSize * 0.8, my); ctx.lineTo(mx + mapSize * 0.8, my + mapSize);
    ctx.stroke();
    // Pin
    const pinX = mx + mapSize * 0.5, pinY = my + mapSize * 0.5;
    ctx.fillStyle = 'rgba(255, 77, 94, 0.3)'; ctx.beginPath(); ctx.arc(pinX, pinY, base * 0.025, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff4d5e'; ctx.beginPath(); ctx.arc(pinX, pinY, base * 0.01, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // 3. Text Information
  let curY = ty;
  
  const locName = els.locationName.value.trim() || 'Unknown Location';
  ctx.font = `bold ${Math.round(base * 0.035)}px sans-serif`;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(locName, tx, curY);
  curY += base * 0.045;

  if (p) {
    ctx.font = `${Math.round(base * 0.022)}px sans-serif`;
    ctx.fillStyle = '#a0b0c0';
    ctx.fillText(formatCoords(p.lat, p.lon), tx, curY);
    curY += base * 0.035;

    const plusCode = encodePlusCode(p.lat, p.lon);
    ctx.font = `monospace ${Math.round(base * 0.022)}px`;
    ctx.fillStyle = '#a0b0c0';
    ctx.fillText(plusCode, tx, curY);
    curY += base * 0.035;
  }

  const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
  const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  ctx.font = `${Math.round(base * 0.022)}px sans-serif`;
  ctx.fillStyle = '#a0b0c0';
  ctx.fillText(`${dateStr} ${timeStr}`, tx, curY);
  curY += base * 0.04;

  const note = els.userNote.value.trim();
  if (note) {
    ctx.font = `italic ${Math.round(base * 0.022)}px sans-serif`;
    ctx.fillStyle = '#d0dae5';
    ctx.fillText(`Note: ${note}`, tx, curY);
  }
}

/* =========================================================
   6. EXIF Writer
   ========================================================= */
function buildExifTiff(pos, date) {
  const ascii = (s) => { const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 0xFF; return b; };
  const rationalsBytes = (pairs) => {
    const b = new Uint8Array(pairs.length * 8); const dv = new DataView(b.buffer);
    pairs.forEach(([n, d], i) => {
      dv.setUint32(i * 8, Math.max(0, Math.round(n)) >>> 0, true);
      dv.setUint32(i * 8 + 4, Math.max(1, Math.round(d)) >>> 0, true);
    }); return b;
  };
  const toDMS = (v) => {
    v = Math.abs(v); const d = Math.floor(v); const mf = (v - d) * 60; const m = Math.floor(mf);
    let s = (mf - m) * 60; let sNum = Math.round(s * 10000);
    if (sNum >= 10000) sNum = 9999; return [[d, 1], [m, 1], [sNum, 10000]];
  };

  const lat = pos.lat, lon = pos.lon, alt = pos.altitude;
  const gps = [];
  gps.push({ tag: 0x0000, type: 1, count: 4, data: new Uint8Array([2, 3, 0, 0]) });
  gps.push({ tag: 0x0001, type: 2, count: 2, data: ascii(lat >= 0 ? 'N\u0000' : 'S\u0000') });
  gps.push({ tag: 0x0002, type: 5, count: 3, data: rationalsBytes(toDMS(lat)) });
  gps.push({ tag: 0x0003, type: 2, count: 2, data: ascii(lon >= 0 ? 'E\u0000' : 'W\u0000') });
  gps.push({ tag: 0x0004, type: 5, count: 3, data: rationalsBytes(toDMS(lon)) });

  if (alt != null && isFinite(alt)) {
    gps.push({ tag: 0x0005, type: 1, count: 1, data: new Uint8Array([alt < 0 ? 1 : 0]) });
    gps.push({ tag: 0x0006, type: 5, count: 1, data: rationalsBytes([[Math.abs(alt) * 100, 100]]) });
  }

  gps.push({ tag: 0x0007, type: 5, count: 3, data: rationalsBytes([[date.getUTCHours(), 1], [date.getUTCMinutes(), 1], [Math.round(date.getUTCSeconds() * 1000), 1000]]) });
  const dateStamp = `${date.getFullYear()}:${pad2(date.getMonth() + 1)}:${pad2(date.getDate())}\u0000`;
  gps.push({ tag: 0x001D, type: 2, count: 11, data: ascii(dateStamp) });

  const dateTimeStr = `${date.getFullYear()}:${pad2(date.getMonth() + 1)}:${pad2(date.getDate())} ${pad2(date.getHours())}:${pad2(date.getMinutes())}:${pad2(date.getSeconds())}\u0000`;
  const ifd0 = [
    { tag: 0x0112, type: 3, count: 1, data: new Uint8Array([1, 0]) },
    { tag: 0x0132, type: 2, count: 20, data: ascii(dateTimeStr) },
  ];

  const IFD0_OFFSET = 8;
  const n0 = ifd0.length + 1;
  const GPS_IFD_OFFSET = IFD0_OFFSET + 2 + n0 * 12 + 4;
  const nG = gps.length;
  let cursor = GPS_IFD_OFFSET + 2 + nG * 12 + 4;

  const ptr = new Uint8Array(4); new DataView(ptr.buffer).setUint32(0, GPS_IFD_OFFSET, true);
  ifd0.push({ tag: 0x8825, type: 4, count: 1, data: ptr });

  const chunks = [];
  const assign = (entry) => {
    const d = entry.data;
    if (d.length <= 4) { entry.inline = true; return; }
    entry.inline = false; entry.offset = cursor;
    chunks.push({ offset: cursor, data: d });
    cursor += d.length; if (cursor % 2) cursor++;
  };
  ifd0.forEach(assign); gps.forEach(assign);

  const out = new Uint8Array(cursor); const dv = new DataView(out.buffer);
  out[0] = 0x49; out[1] = 0x49; dv.setUint16(2, 0x002A, true); dv.setUint32(4, IFD0_OFFSET, true);

  const writeIFD = (offset, entries) => {
    dv.setUint16(offset, entries.length, true);
    let p = offset + 2;
    for (const e of entries) {
      dv.setUint16(p, e.tag, true); dv.setUint16(p + 2, e.type, true); dv.setUint32(p + 4, e.count, true);
      if (e.inline) out.set(e.data, p + 8); else dv.setUint32(p + 8, e.offset, true);
      p += 12;
    }
    dv.setUint32(p, 0, true);
  };

  writeIFD(IFD0_OFFSET, ifd0); writeIFD(GPS_IFD_OFFSET, gps);
  for (const c of chunks) out.set(c.data, c.offset);
  return out;
}

function injectApp1(jpegBuffer, tiffBytes) {
  const src = new Uint8Array(jpegBuffer);
  if (src.length < 4 || src[0] !== 0xFF || src[1] !== 0xD8) return src;
  const exifId = [0x45, 0x78, 0x69, 0x66, 0x00, 0x00];
  const payload = exifId.length + tiffBytes.length;
  const app1Len = payload + 2;
  const app1 = new Uint8Array(2 + app1Len);
  app1[0] = 0xFF; app1[1] = 0xE1; app1[2] = (app1Len >> 8) & 0xFF; app1[3] = app1Len & 0xFF;
  app1.set(exifId, 4); app1.set(tiffBytes, 4 + exifId.length);
  const out = new Uint8Array(src.length + app1.length);
  out.set(src.subarray(0, 2), 0); out.set(app1, 2); out.set(src.subarray(2), 2 + app1.length);
  return out;
}

async function withExifGps(blob, pos, date) {
  try {
    const buf = await blob.arrayBuffer();
    const tiff = buildExifTiff(pos, date);
    const merged = injectApp1(buf, tiff);
    return new Blob([merged], { type: 'image/jpeg' });
  } catch (err) { return blob; }
}

/* =========================================================
   7. File Saving
   ========================================================= */
function geoSlug() { const p = state.position; return p ? `${p.lat.toFixed(5)}_${p.lon.toFixed(5)}` : 'nogps'; }
function buildFilename(kind, ext) { const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19); return `geocam_${kind}_${stamp}_${geoSlug()}.${ext}`; }

function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 120000);
  return url;
}

/* =========================================================
   8. Gallery
   ========================================================= */
function addItem({ kind, blob, url, filename, meta }) {
  const id = ++state.itemSeq;
  state.items.push({ id, kind, blob, url, filename, meta });
  renderGallery();
}

function renderGallery() {
  els.count.textContent = state.items.length;
  if (!state.items.length) { els.galleryGrid.innerHTML = '<div class="empty-msg">No captures yet.</div>'; return; }
  els.galleryGrid.innerHTML = '';
  for (let i = state.items.length - 1; i >= 0; i--) {
    const it = state.items[i];
    const row = document.createElement('div'); row.className = 'gallery-item';
    if (it.kind === 'photo') {
      const img = document.createElement('img'); img.src = it.url; row.appendChild(img);
    } else {
      const v = document.createElement('video'); v.src = it.url + '#t=0.4'; v.muted = true; v.playsInline = true; v.preload = 'metadata'; row.appendChild(v);
    }
    const info = document.createElement('div'); info.className = 'info';
    const name = document.createElement('div'); name.className = 'name'; name.textContent = it.filename;
    const sub = document.createElement('div'); sub.className = 'sub';
    sub.textContent = it.meta.location ? `${it.meta.location.lat.toFixed(4)}, ${it.meta.location.lon.toFixed(4)}` : 'no GPS';
    info.appendChild(name); info.appendChild(sub); row.appendChild(info);
    
    const acts = document.createElement('div'); acts.className = 'acts';
    const a = document.createElement('a'); a.href = it.url; a.download = it.filename; a.textContent = '⬇'; acts.appendChild(a);
    const mb = document.createElement('button'); mb.textContent = '{ }'; mb.title = 'Download JSON';
    mb.addEventListener('click', () => {
      const jb = new Blob([JSON.stringify(it.meta, null, 2)], { type: 'application/json' });
      saveBlob(jb, it.filename.replace(/\.[^.]+$/, '') + '.json');
    });
    acts.appendChild(mb); row.appendChild(acts);
    els.galleryGrid.appendChild(row);
  }
}

/* =========================================================
   9. Photo Capture
   ========================================================= */
async function capturePhoto() {
  if (!state.stream) return;
  const v = els.video;
  const w = v.videoWidth || 1280; const h = v.videoHeight || 720;
  const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');

  ctx.save();
  if (state.facingMode === 'user') { ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(v, 0, 0, w, h);
  ctx.restore();

  if (els.chkOverlay.checked) drawWatermark(ctx, w, h);

  els.flash.classList.add('go'); requestAnimationFrame(() => els.flash.classList.remove('go'));

  let blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.93));
  if (!blob) return;

  const now = new Date();
  if (els.chkExif.checked && state.position) blob = await withExifGps(blob, state.position, now);

  const filename = buildFilename('photo', 'jpg');
  const url = saveBlob(blob, filename);
  addItem({ kind: 'photo', blob, url, filename, meta: buildMeta('photo', { width: w, height: h, bytes: blob.size }) });
}

function buildMeta(kind, extra = {}) {
  const p = state.position;
  return {
    type: kind, capturedAt: new Date().toISOString(),
    locationName: els.locationName.value.trim() || null,
    userNote: els.userNote.value.trim() || null,
    plusCode: p ? encodePlusCode(p.lat, p.lon) : null,
    location: p ? { latitude: p.lat, longitude: p.lon, accuracyMeters: p.accuracy, altitudeMeters: p.altitude, headingDegrees: p.heading, speedMetersPerSecond: p.speed } : null,
    overlayBurnedIn: els.chkOverlay.checked, exifGpsWritten: kind === 'photo' ? els.chkExif.checked : false,
    device: { userAgent: navigator.userAgent, platform: navigator.platform, language: navigator.language },
    ...extra,
  };
}

/* =========================================================
   10. Video Recording
   ========================================================= */
function pickVideoMime() {
  const c = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4'];
  if (typeof MediaRecorder === 'undefined') return '';
  for (const m of c) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (_) {} }
  return '';
}

function startRecording() {
  if (!state.stream || state.recording) return;
  const v = els.video; const w = v.videoWidth || 1280; const h = v.videoHeight || 720;
  let recordStream, canvas, ctx;
  const canCanvasCapture = typeof HTMLCanvasElement !== 'undefined' && typeof HTMLCanvasElement.prototype.captureStream === 'function';

  if (canCanvasCapture) {
    canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
    ctx = canvas.getContext('2d', { alpha: false }); recordStream = canvas.captureStream(30);
    drawVideoFrame(ctx, w, h);
  } else {
    recordStream = new MediaStream(); state.stream.getVideoTracks().forEach(t => recordStream.addTrack(t));
  }
  state.stream.getAudioTracks().forEach(t => recordStream.addTrack(t));

  const mime = pickVideoMime();
  let recorder;
  try { recorder = new MediaRecorder(recordStream, { ...(mime ? { mimeType: mime } : {}), videoBitsPerSecond: 6_000_000, audioBitsPerSecond: 128_000 }); }
  catch (err) { try { recorder = new MediaRecorder(recordStream); } catch (err2) { return; } }

  state.chunks = []; state.recorder = recorder; state.recording = true; state.recStart = Date.now();
  recorder.ondataavailable = (e) => { if (e.data && e.data.size) state.chunks.push(e.data); };
  recorder.onstop = () => {
    const type = recorder.mimeType || 'video/webm'; const blob = new Blob(state.chunks, { type });
    const ext = type.includes('mp4') ? 'mp4' : 'webm'; const filename = buildFilename('video', ext);
    const durationMs = Date.now() - state.recStart; const url = saveBlob(blob, filename);
    addItem({ kind: 'video', blob, url, filename, meta: buildMeta('video', { width: w, height: h, durationMs, bytes: blob.size, mimeType: type }) });
    state.chunks = [];
  };

  state.recUsingRVFC = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;
  const loop = () => {
    if (!state.recording) return;
    if (canvas && ctx) drawVideoFrame(ctx, w, h);
    state.recFrameHandle = state.recUsingRVFC ? v.requestVideoFrameCallback(loop) : requestAnimationFrame(loop);
  };

  function drawVideoFrame(context, cw, ch) {
    context.save();
    if (state.facingMode === 'user') { context.translate(cw, 0); context.scale(-1, 1); }
    try { context.drawImage(v, 0, 0, cw, ch); } catch (_) {}
    context.restore();
    if (els.chkOverlay.checked) drawWatermark(context, cw, ch);
  }

  loop(); recorder.start(1000);
  els.btnShutter.disabled = true;
  els.btnRecord.classList.add('active');
  els.recTimer.classList.add('on'); els.recTime.textContent = '00:00';

  state.recTicker = setInterval(() => {
    const s = Math.floor((Date.now() - state.recStart) / 1000);
    els.recTime.textContent = `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}`;
  }, 250);
}

function stopRecording() {
  if (!state.recording) return;
  state.recording = false;
  const v = els.video;
  if (state.recFrameHandle != null) {
    try { if (state.recUsingRVFC) v.cancelVideoFrameCallback(state.recFrameHandle); else cancelAnimationFrame(state.recFrameHandle); } catch (_) {}
    state.recFrameHandle = null;
  }
  clearInterval(state.recTicker); state.recTicker = null;
  try { if (state.recorder && state.recorder.state !== 'inactive') state.recorder.stop(); } catch (err) {}
  els.btnShutter.disabled = false;
  els.btnRecord.classList.remove('active');
  els.recTimer.classList.remove('on');
}

/* =========================================================
   11. UI Event Wiring
   ========================================================= */
els.btnStart.addEventListener('click', async () => { await startCamera(); });
els.btnSwitchCam.addEventListener('click', switchCamera);
els.btnShutter.addEventListener('click', () => { capturePhoto().catch(e => console.error(e)); });
els.btnRecord.addEventListener('click', () => { if (state.recording) stopRecording(); else startRecording(); });

els.btnSettings.addEventListener('click', () => els.settingsPanel.classList.add('open'));
els.closeSettings.addEventListener('click', () => els.settingsPanel.classList.remove('open'));
els.btnGallery.addEventListener('click', () => els.galleryPanel.classList.add('open'));
els.closeGallery.addEventListener('click', () => els.galleryPanel.classList.remove('open'));

els.chkAudio.addEventListener('change', async () => { if (state.stream) await startCamera(); });

window.addEventListener('beforeunload', () => {
  stopRecording(); stopCamera(); stopGeolocation();
  state.items.forEach(it => { try { URL.revokeObjectURL(it.url); } catch (_) {} });
});

renderGallery();
</script>
